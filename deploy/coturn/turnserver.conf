# TURN for restrictive networks. Time-limited credentials (use-auth-secret) are
# issued by NeoShard's media-auth (GET /api/v1/turn).
listening-port=3478
tls-listening-port=5349
# For networks that only allow 443: run a second instance bound to 443 on a dedicated IP.
fingerprint
use-auth-secret
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
