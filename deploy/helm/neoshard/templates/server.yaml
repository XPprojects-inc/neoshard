apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-server
spec:
  serviceName: {{ .Release.Name }}-server
  replicas: {{ .Values.server.replicas }}
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: {{ .Release.Name }}-server } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /gateway/metrics
        prometheus.io/port: "8080"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: server
          image: {{ .Values.image.server }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          # Snowflake worker id = StatefulSet ordinal (unique per pod).
          args: ["export NEOSHARD_WORKER_ID=${HOSTNAME##*-}; exec /usr/local/bin/neoshard-server"]
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: NEOSHARD_PUBLIC_URL, value: "https://{{ .Values.domain }}" }
            - { name: NEOSHARD_DOMAIN, value: "{{ .Values.domain }}" }
            - { name: NEOSHARD_TRUST_PROXY, value: "true" }
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }} }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-server }
spec:
  selector: { app: {{ .Release.Name }}-server }
  ports: [{ port: 8080, targetPort: http, name: http }]
