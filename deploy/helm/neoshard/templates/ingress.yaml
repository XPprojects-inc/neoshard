apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: ["{{ .Values.domain }}"], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          {{- range list "/api" "/gateway" "/.well-known/neoshard" "/federation" "/healthz" }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: {{ $.Release.Name }}-server, port: { number: 8080 } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { number: 80 } } }
