[package]
name = "neoshard-core"
description = "NeoShard client core (TDLib-style): gateway state machine, cache, optimistic outbox, permissions. No UI; drivers for native, WASM and mobile."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# cdylib/staticlib are built on demand (`cargo rustc --crate-type cdylib`):
# keeping them here makes every test link a DLL with all openmls symbols
# exported, which overflows the PE export table on windows-gnu.
crate-type = ["rlib"]

[features]
default = ["native"]
# tokio driver: WebSocket + HTTP + SQLite store (CLI, Tauri, tests, uniffi)
native = ["dep:tokio", "dep:tokio-tungstenite", "dep:reqwest", "dep:rusqlite", "dep:futures-util", "neoshard-proto/zstd-native"]
# browser driver via wasm-bindgen (IndexedDB store through a small JS shim)
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "neoshard-proto/zstd-pure", "openmls?/js"]
# MLS end-to-end encryption (lazy-loaded chunk on web)
e2ee = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:tls_codec", "dep:base64", "dep:getrandom"]
# noise suppression (RNNoise port)
audio = ["dep:nnnoiseless"]
# Kotlin/Swift bindings
ffi = ["native", "dep:uniffi"]

[dependencies]
neoshard-proto.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = { workspace = true, optional = true }

tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }
reqwest = { workspace = true, optional = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
futures-util = { workspace = true, optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Window", "Request", "RequestInit", "Response", "Headers", "console"] }

openmls = { version = "0.6", optional = true }
openmls_rust_crypto = { version = "0.3", optional = true }
openmls_basic_credential = { version = "0.3", optional = true }
tls_codec = { version = "0.4", optional = true }
nnnoiseless = { version = "0.5", optional = true, default-features = false }
uniffi = { version = "0.28", optional = true }

# openmls draws randomness through getrandom 0.2; in the browser that is crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", optional = true, features = ["js"] }

[dev-dependencies]
neoshard-server = { path = "../../server/neoshard-server" }
neoshard-server-common.workspace = true
sqlx.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
criterion = "0.5"

[[bench]]
name = "boundary"
harness = false
